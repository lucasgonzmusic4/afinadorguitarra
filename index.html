<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>Afinador - Lucas Gonzalez</title>
    
    <!-- Enlaces obligatorios PWA (Forzando limpieza de caché) -->
    <link rel="manifest" href="./manifest.json?v=5">
    <link rel="apple-touch-icon" href="./icono.png">
    
    <!-- Alertas Profesionales -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* --- VARIABLES GLOBALES DE NEÓN --- */
        :root {
            --color-neon: #333333;
            --sombra-neon: none;
            --brillo-texto: none;
        }

        .estado-bajo { 
            --color-neon: #ff00ff; 
            --sombra-neon: drop-shadow(0 0 12px #ff00ff);
            --brillo-texto: 0 0 20px rgba(255, 0, 255, 0.8);
        }
        .estado-alto { 
            --color-neon: #00f3ff; 
            --sombra-neon: drop-shadow(0 0 12px #00f3ff);
            --brillo-texto: 0 0 20px rgba(0, 243, 255, 0.8);
        }
        .estado-afinado { 
            --color-neon: #10B981; 
            --sombra-neon: drop-shadow(0 0 15px #10B981);
            --brillo-texto: 0 0 30px rgba(16, 185, 129, 1);
        }

        /* --- ESTILOS GENERALES Y DEL ECOSISTEMA --- */
        html, body {
            background-color: #0a0a0a; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 0; overflow-x: hidden; 
            user-select: none; -webkit-user-select: none;
        }

        .titulo-flet {
            color: #00f3ff;
            font-size: 2.2em; font-weight: 900; text-align: center;
            margin-top: 40px; letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .titulo-activacion {
            color: #ff00ff;
            font-size: 1.5em; font-weight: 900; text-align: center;
            margin-top: 40px; letter-spacing: 2px;
        }

        .pantalla { display: none; width: 100vw; min-height: 100vh; flex-direction: column; align-items: center; background-color: #0a0a0a; padding-bottom: 40px; }
        .activa { display: flex; }

        /* Botones estilo Flet Original */
        .btn-principal {
            padding: 18px 30px; margin: 10px; font-size: 1.1em; font-weight: 800;
            cursor: pointer; border-radius: 8px; transition: 0.3s;
            width: 85%; max-width: 380px; text-transform: uppercase; letter-spacing: 2px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            border: none;
        }
        .btn-fucsia { background-color: #ff00ff; color: #ffffff; box-shadow: 0 4px 15px rgba(255, 0, 255, 0.2); }
        .btn-fucsia:active { background-color: #cc00cc; box-shadow: 0 0 25px rgba(255, 0, 255, 0.8); }

        /* Inputs estilo Flet */
        .input-cyber {
            width: 90%; max-width: 420px; padding: 15px;
            background-color: #111; color: #00f3ff; border: 1px solid #ff00ff;
            border-radius: 5px; font-size: 1.1em; margin-bottom: 20px;
            outline: none; box-sizing: border-box; font-weight: bold;
        }
        .input-cyber:focus { box-shadow: 0 0 10px rgba(255,0,255,0.3); }

        /* --- ESTILOS DEL VELOCÍMETRO CYBERPUNK --- */
        .visor-afinador {
            width: 90%; max-width: 450px;
            background-color: #0d0d12;
            /* Grid Holográfica */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            border: 2px solid #222;
            border-radius: 20px;
            padding: 40px 15px 30px 15px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .estado-afinado.visor-afinador { 
            border-color: rgba(16, 185, 129, 0.4); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 40px rgba(16, 185, 129, 0.15); 
        }

        .gauge-container {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        .gauge-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        /* Aguja animada y estilizada por variables CSS */
        #grupo-aguja {
            transform-origin: 100px 130px;
            transform: rotate(0deg);
            transition: transform 0.1s ease-out; /* Super suave */
        }
        
        #aguja-poligono {
            fill: var(--color-neon);
            filter: var(--sombra-neon);
            transition: fill 0.2s, filter 0.2s;
        }

        #aguja-base {
            stroke: var(--color-neon);
            box-shadow: var(--sombra-neon);
            transition: stroke 0.2s;
        }

        /* Textos superpuestos al velocímetro */
        .gauge-text {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }

        .nota-display {
            font-size: 6.5em;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
            margin: 0;
            color: var(--color-neon);
            text-shadow: var(--brillo-texto);
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }
        .nota-display span {
            font-size: 0.4em;
            vertical-align: super;
            font-style: normal;
        }

        .hud-box {
            display: inline-block;
            border: 1px solid var(--color-neon);
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 15px;
            border-radius: 6px;
            margin-top: 15px;
            transition: border-color 0.2s ease;
        }

        .hz-display {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--color-neon);
            font-family: monospace;
            letter-spacing: 2px;
            transition: color 0.2s ease;
        }

        #contenedor-encendido {
            margin-top: 50px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease;
        }

    </style>
</head>
<body>

    <!-- ================= PANTALLA 1: LOGIN ================= -->
    <div id="pantalla-login" class="pantalla activa">
        <h1 class="titulo-activacion">ACTIVACIÓN DE SOFTWARE</h1>
        
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <p style="color: #777; width: 90%; max-width: 420px; text-align: center; margin-bottom: 20px; font-size: 0.9em;">
                Ingresa el correo con el que realizaste la compra.
            </p>
            <input type="email" id="input-email-login" class="input-cyber" style="border-color: #00f3ff; color: #fff;" placeholder="Email de Compra">
            <button class="btn-principal btn-fucsia" onclick="intentarActivar()">ACTIVAR APLICACIÓN</button>
            <p id="mensaje-login" style="color: red; font-weight: bold; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- ================= PANTALLA 2: AFINADOR ================= -->
    <div id="pantalla-afinador" class="pantalla" style="padding-top: 10px;">
        <h1 class="titulo-flet">AFINADOR</h1>
        
        <div id="visor" class="visor-afinador">
            
            <!-- Velocímetro Vectorial Avanzado -->
            <div class="gauge-container">
                <svg viewBox="0 0 200 150" class="gauge-svg">
                    <!-- Arco de fondo grueso -->
                    <path d="M 20 130 A 80 80 0 0 1 180 130" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/>
                    
                    <!-- Marcas (Ticks) segmentadas -->
                    <path d="M 20 130 A 80 80 0 0 1 180 130" fill="none" stroke="#2a2a2a" stroke-width="18" stroke-dasharray="3 7"/>
                    
                    <!-- Marcas de los extremos y el centro -->
                    <path d="M 97 49 A 80 80 0 0 1 103 49" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" opacity="0.2"/>
                    <line x1="100" y1="35" x2="100" y2="60" stroke="#10B981" stroke-width="3" />

                    <!-- Aguja Animada Cyberpunk -->
                    <g id="grupo-aguja">
                        <!-- Cuerpo de la aguja -->
                        <polygon id="aguja-poligono" points="97,130 103,130 100,45" />
                        <!-- Círculo base -->
                        <circle id="aguja-base" cx="100" cy="130" r="10" fill="#0a0a0a" stroke-width="3" />
                    </g>
                </svg>
                
                <!-- Textos Centrales -->
                <div class="gauge-text">
                    <h2 id="nota-ui" class="nota-display">-</h2>
                </div>
            </div>
            
            <!-- HUD Inferior con data técnica -->
            <div class="hud-box">
                <div id="hz-ui" class="hz-display">0.00 Hz</div>
            </div>
        </div>

        <div id="contenedor-encendido">
            <button class="btn-principal btn-fucsia" onclick="arrancarAfinador()">ACTIVAR MICRÓFONO</button>
            <p style="color: #555; font-size: 0.85em; text-align: center; width: 80%; margin-top: 15px;">
                Requiere permisos de audio.
            </p>
        </div>
    </div>

    <!-- ================= LÓGICA DE LA APP ================= -->
    <script>
        // --- SISTEMA DE DATOS Y LOGIN ---
        const URL_RECEPCIONISTA = "https://script.google.com/macros/s/AKfycbx6-2gfl9UGXOi5CQDaEC55_89hsRflJGF8DyiC9jz4hw82mhMaEmeK99Y4VxOKoVW6/exec";
        
        function obtenerDeviceID() {
            let id = localStorage.getItem('afinador_device_id');
            if (!id) {
                id = crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('afinador_device_id', id);
            }
            return id;
        }

        window.onload = () => {
            if (localStorage.getItem('afinador_activado') === 'true') {
                cambiarPantalla('pantalla-afinador');
            }
        };

        function cambiarPantalla(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        async function intentarActivar() {
            let email = document.getElementById('input-email-login').value.trim();
            let msj = document.getElementById('mensaje-login');

            if (!email) { msj.innerText = "Por favor, ingresa un correo."; msj.style.color = "red"; return; }
            msj.innerText = "Conectando con el servidor..."; msj.style.color = "#00f3ff";
            
            try {
                let response = await fetch(URL_RECEPCIONISTA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ email: email, deviceID: obtenerDeviceID() })
                });
                let data = await response.json();
                if (data.status === "OK") {
                    localStorage.setItem('afinador_activado', 'true');
                    cambiarPantalla('pantalla-afinador');
                } else {
                    msj.innerText = data.message || "Error de validación"; msj.style.color = "red";
                }
            } catch (error) {
                msj.innerText = "Sin conexión a internet."; msj.style.color = "red";
            }
        }

        // --- MOTOR DEL AFINADOR CROMÁTICO ---
        let audioContext;
        let analyser;
        let microphone;
        let biquadFilter;
        let isTuning = false;

        const NOMBRES_NOTAS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const A4_FREQ = 440; 
        
        // Elementos de la UI
        const visorEl = document.getElementById('visor');
        const notaEl = document.getElementById('nota-ui');
        const hzEl = document.getElementById('hz-ui');
        const agujaGrupo = document.getElementById('grupo-aguja');
        const contenedorEncendido = document.getElementById('contenedor-encendido');

        // Matemáticas Musicales
        function calcularNotaDesdeFrecuencia(frecuencia) {
            let noteNum = 12 * (Math.log(frecuencia / A4_FREQ) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        function calcularFrecuenciaDesdeNota(notaMidi) {
            return A4_FREQ * Math.pow(2, (notaMidi - 69) / 12);
        }

        function calcularCentsOffset(frecuenciaReal, notaMidiCentral) {
            let freqCentral = calcularFrecuenciaDesdeNota(notaMidiCentral);
            return Math.floor(1200 * Math.log(frecuenciaReal / freqCentral) / Math.log(2));
        }

        function formatearNombreNota(notaMidi) {
            let nombre = NOMBRES_NOTAS[notaMidi % 12];
            if(nombre.includes("#")) {
                let partes = nombre.split("#");
                return `${partes[0]}<span>#</span>`;
            }
            return nombre;
        }

        // Algoritmo de Autocorrelación para JS
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            
            // Subimos el umbral de corte para ignorar ruidos fantasmas
            if (rms < 0.015) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        async function arrancarAfinador() {
            if (isTuning) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if(audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // Filtro Pasa-Bajos para matar los armónicos de guitarra
                biquadFilter = audioContext.createBiquadFilter();
                biquadFilter.type = "lowpass";
                biquadFilter.frequency.value = 350; 
                biquadFilter.Q.value = 1;

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 4096;

                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(biquadFilter);
                biquadFilter.connect(analyser);
                
                isTuning = true;
                
                // Limpieza de UI: Ocultamos el botón al encender
                contenedorEncendido.style.opacity = '0';
                setTimeout(() => { contenedorEncendido.style.display = 'none'; }, 300);
                
                procesarAudio();

            } catch (err) {
                Swal.fire({
                    title: 'Micrófono Inactivo',
                    text: 'Debes otorgar permisos para poder afinar.',
                    icon: 'error',
                    background: '#1a1a1a', color: '#fff', confirmButtonColor: '#ff00ff'
                });
            }
        }

        let buffer = new Float32Array(4096);
        let frecuenciaSuavizada = 0;

        function procesarAudio() {
            analyser.getFloatTimeDomainData(buffer);
            let frecuenciaCruda = autoCorrelate(buffer, audioContext.sampleRate);

            if (frecuenciaCruda !== -1) {
                
                // Sistema Anti-Oscilación Ultra Estable
                if (frecuenciaSuavizada === 0 || Math.abs(frecuenciaSuavizada - frecuenciaCruda) > 15) {
                    frecuenciaSuavizada = frecuenciaCruda;
                } else {
                    // 85% viejo, 15% nuevo (Movimiento súper denso y fluido)
                    frecuenciaSuavizada = (frecuenciaSuavizada * 0.85) + (frecuenciaCruda * 0.15);
                }

                let notaMidi = calcularNotaDesdeFrecuencia(frecuenciaSuavizada);
                let cents = calcularCentsOffset(frecuenciaSuavizada, notaMidi);

                // TRUCO DE ESTABILIDAD: Efecto Magnetismo al 0
                // Si la aguja está muy cerca de la afinación perfecta, la "clava" en el medio.
                if (Math.abs(cents) <= 2) {
                    cents = 0;
                }

                // Actualizar Textos
                notaEl.innerHTML = formatearNombreNota(notaMidi);
                hzEl.innerText = frecuenciaSuavizada.toFixed(1) + " Hz";

                // Mapear los cents a los grados de la aguja (-50 a +50 cents = -75 a +75 grados)
                let angulo = (cents / 50) * 75; 
                if(angulo > 75) angulo = 75;
                if(angulo < -75) angulo = -75;
                
                agujaGrupo.style.transform = `rotate(${angulo}deg)`;

                // Actualizar Clases de Estado (Inyectando variables CSS mágicamente)
                visorEl.classList.remove('estado-bajo', 'estado-alto', 'estado-afinado');

                if (cents < -2) {
                    visorEl.classList.add('estado-bajo');
                } else if (cents > 2) {
                    visorEl.classList.add('estado-alto');
                } else {
                    visorEl.classList.add('estado-afinado');
                }
            }

            if(isTuning) {
                requestAnimationFrame(procesarAudio);
            }
        }

        // --- SCRIPT PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=tuner3')
                    .then(reg => console.log('SW Registrado'))
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>
</html>
