<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050508">
    <title>Afinador Pro - Lucas Gonzalez</title>
    
    <!-- Enlaces obligatorios PWA (Forzando limpieza de caché v9) -->
    <link rel="manifest" href="./manifest.json?v=9">
    <link rel="apple-touch-icon" href="./icono.png">
    
    <!-- Fuentes Cyberpunk de Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');
    </style>

    <!-- Alertas Profesionales -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* --- VARIABLES GLOBALES DE NEÓN --- */
        :root {
            --color-neon: #444444;
            --sombra-neon: none;
            --brillo-texto: none;
            --bg-hud: rgba(255, 255, 255, 0.02);
        }

        .estado-bajo { 
            --color-neon: #ff00ff; 
            --sombra-neon: drop-shadow(0 0 10px #ff00ff);
            --brillo-texto: 0 0 25px rgba(255, 0, 255, 0.9);
            --bg-hud: rgba(255, 0, 255, 0.05);
        }
        .estado-alto { 
            --color-neon: #00f3ff; 
            --sombra-neon: drop-shadow(0 0 10px #00f3ff);
            --brillo-texto: 0 0 25px rgba(0, 243, 255, 0.9);
            --bg-hud: rgba(0, 243, 255, 0.05);
        }
        .estado-afinado { 
            --color-neon: #10B981; 
            --sombra-neon: drop-shadow(0 0 15px #10B981);
            --brillo-texto: 0 0 35px rgba(16, 185, 129, 1);
            --bg-hud: rgba(16, 185, 129, 0.08);
        }

        /* --- ESTILOS GENERALES Y DEL ECOSISTEMA --- */
        html, body {
            background-color: #050508; color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden; 
            user-select: none; -webkit-user-select: none;
        }

        body {
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
        }

        .titulo-flet {
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2em; font-weight: 900; text-align: center;
            margin-top: 40px; letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        
        .titulo-activacion {
            color: #ff00ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em; font-weight: 900; text-align: center;
            margin-top: 40px; letter-spacing: 2px;
        }

        .pantalla { display: none; width: 100vw; min-height: 100vh; flex-direction: column; align-items: center; padding-bottom: 40px; }
        .activa { display: flex; }

        .btn-principal {
            font-family: 'Rajdhani', sans-serif;
            padding: 18px 30px; margin: 10px; font-size: 1.2em; font-weight: 800;
            cursor: pointer; border-radius: 8px; transition: 0.3s;
            width: 85%; max-width: 380px; text-transform: uppercase; letter-spacing: 3px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            border: none;
        }
        .btn-fucsia { background-color: #ff00ff; color: #ffffff; box-shadow: 0 4px 20px rgba(255, 0, 255, 0.3); }
        .btn-fucsia:active { background-color: #cc00cc; box-shadow: 0 0 30px rgba(255, 0, 255, 0.8); }

        .input-cyber {
            font-family: 'Rajdhani', sans-serif;
            width: 90%; max-width: 420px; padding: 15px;
            background-color: rgba(17, 17, 17, 0.8); color: #00f3ff; border: 1px solid #ff00ff;
            border-radius: 5px; font-size: 1.2em; margin-bottom: 20px;
            outline: none; box-sizing: border-box; font-weight: bold;
        }
        .input-cyber:focus { box-shadow: 0 0 15px rgba(255,0,255,0.4); }

        /* --- VISOR HOLOGRÁFICO SEPARADO --- */
        .visor-afinador {
            width: 90%; max-width: 450px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 30px 20px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px var(--bg-hud);
            transition: all 0.3s ease;
        }

        .estado-afinado.visor-afinador { 
            border-color: rgba(16, 185, 129, 0.3); 
        }

        .nota-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            min-height: 120px; 
        }

        .nota-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 7.5em;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            color: var(--color-neon);
            text-shadow: var(--brillo-texto);
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }
        .nota-display span {
            font-size: 0.4em;
            vertical-align: top;
            margin-left: -5px;
        }

        .gauge-container {
            width: 100%;
            max-width: 300px;
            position: relative;
            margin-bottom: 25px;
        }

        .gauge-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        #aguja-poligono {
            fill: var(--color-neon);
            filter: var(--sombra-neon);
            /* Transiciones de color mantenidas, pero sin transición de movimiento */
            transition: fill 0.15s, filter 0.15s;
        }

        #aguja-base {
            fill: #111;
            stroke: var(--color-neon);
            box-shadow: var(--sombra-neon);
            transition: stroke 0.15s;
        }

        .hud-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            border: 1px solid var(--color-neon);
            background: var(--bg-hud);
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .hud-valor {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.8em;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .hud-data {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--color-neon);
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        #contenedor-encendido {
            margin-top: 50px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease;
        }

    </style>
</head>
<body>

    <!-- ================= PANTALLA 1: LOGIN ================= -->
    <div id="pantalla-login" class="pantalla activa">
        <h1 class="titulo-activacion">ACTIVACIÓN DE SOFTWARE</h1>
        
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <p style="color: #777; font-family: 'Rajdhani', sans-serif; width: 90%; max-width: 420px; text-align: center; margin-bottom: 20px; font-size: 1.1em;">
                Ingresa el correo con el que realizaste la compra.
            </p>
            <input type="email" id="input-email-login" class="input-cyber" style="border-color: #00f3ff; color: #fff;" placeholder="Email de Compra">
            <button class="btn-principal btn-fucsia" onclick="intentarActivar()">ACTIVAR APLICACIÓN</button>
            <p id="mensaje-login" style="color: red; font-weight: bold; margin-top: 15px; font-size: 1.2em;"></p>
        </div>
    </div>

    <!-- ================= PANTALLA 2: AFINADOR ================= -->
    <div id="pantalla-afinador" class="pantalla" style="padding-top: 10px;">
        <h1 class="titulo-flet">AFINADOR</h1>
        
        <div id="visor" class="visor-afinador">
            
            <div class="nota-container">
                <h2 id="nota-ui" class="nota-display">-</h2>
            </div>
            
            <div class="gauge-container">
                <svg viewBox="0 0 200 120" class="gauge-svg">
                    <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#15151a" stroke-width="12" stroke-linecap="round"/>
                    <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#2a2a35" stroke-width="12" stroke-dasharray="2 10.5"/>
                    <path d="M 96 20 A 80 80 0 0 1 104 20" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round" opacity="0.15"/>
                    <line x1="100" y1="8" x2="100" y2="32" stroke="#10B981" stroke-width="3" />

                    <!-- Aguja Animada sin CSS Transition (Puro Javascript a 60fps) -->
                    <g id="grupo-aguja" style="transform-origin: 100px 100px;">
                        <polygon id="aguja-poligono" points="98,100 102,100 100,20" />
                        <circle id="aguja-base" cx="100" cy="100" r="8" stroke-width="3" />
                    </g>
                </svg>
            </div>
            
            <div class="hud-box">
                <div class="hud-valor">
                    <span class="hud-label">DESVÍO</span>
                    <span id="cents-ui" class="hud-data">0</span>
                </div>
                <div class="hud-valor">
                    <span class="hud-label">FRECUENCIA</span>
                    <span id="hz-ui" class="hud-data">0.0</span>
                </div>
            </div>
        </div>

        <div id="contenedor-encendido">
            <button class="btn-principal btn-fucsia" onclick="arrancarAfinador()">ACTIVAR MICRÓFONO</button>
            <p style="color: #555; font-size: 1em; text-align: center; width: 80%; margin-top: 15px;">
                Se requieren permisos de hardware de audio.
            </p>
        </div>
    </div>

    <!-- ================= LÓGICA DE LA APP ================= -->
    <script>
        // --- SISTEMA DE DATOS Y LOGIN ---
        const URL_RECEPCIONISTA = "https://script.google.com/macros/s/AKfycbwghw7ZmH5DScoPehYVo1qMcjQaegVitSKRPnER31nbL4WYq92lPakCGT6BLSB8vG1e/exec";
        
        function obtenerDeviceID() {
            let id = localStorage.getItem('afinador_device_id');
            if (!id) {
                id = crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('afinador_device_id', id);
            }
            return id;
        }

        window.onload = () => {
            if (localStorage.getItem('afinador_activado') === 'true') {
                cambiarPantalla('pantalla-afinador');
            }
        };

        function cambiarPantalla(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        async function intentarActivar() {
            let email = document.getElementById('input-email-login').value.trim();
            let msj = document.getElementById('mensaje-login');

            if (!email) { msj.innerText = "Por favor, ingresa un correo."; msj.style.color = "red"; return; }
            msj.innerText = "Conectando con el servidor..."; msj.style.color = "#00f3ff";
            
            try {
                let response = await fetch(URL_RECEPCIONISTA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ email: email, deviceID: obtenerDeviceID() })
                });
                let data = await response.json();
                if (data.status === "OK") {
                    localStorage.setItem('afinador_activado', 'true');
                    cambiarPantalla('pantalla-afinador');
                } else {
                    msj.innerText = data.message || "Error de validación"; msj.style.color = "red";
                }
            } catch (error) {
                msj.innerText = "Sin conexión a internet."; msj.style.color = "red";
            }
        }

        // --- MOTOR DEL AFINADOR CROMÁTICO ---
        let audioContext;
        let analyser;
        let microphone;
        let biquadFilter;
        let isTuning = false;

        const NOMBRES_NOTAS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const A4_FREQ = 440; 
        
        const visorEl = document.getElementById('visor');
        const notaEl = document.getElementById('nota-ui');
        const centsEl = document.getElementById('cents-ui');
        const hzEl = document.getElementById('hz-ui');
        const agujaGrupo = document.getElementById('grupo-aguja');
        const contenedorEncendido = document.getElementById('contenedor-encendido');

        function calcularNotaDesdeFrecuencia(frecuencia) {
            let noteNum = 12 * (Math.log(frecuencia / A4_FREQ) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        function calcularFrecuenciaDesdeNota(notaMidi) {
            return A4_FREQ * Math.pow(2, (notaMidi - 69) / 12);
        }

        function calcularCentsOffset(frecuenciaReal, notaMidiCentral) {
            let freqCentral = calcularFrecuenciaDesdeNota(notaMidiCentral);
            return Math.floor(1200 * Math.log(frecuenciaReal / freqCentral) / Math.log(2));
        }

        function formatearNombreNota(notaMidi) {
            let nombre = NOMBRES_NOTAS[notaMidi % 12];
            if(nombre.includes("#")) {
                let partes = nombre.split("#");
                return `${partes[0]}<span>#</span>`;
            }
            return nombre;
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            
            if (rms < 0.01) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        async function arrancarAfinador() {
            if (isTuning) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if(audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                biquadFilter = audioContext.createBiquadFilter();
                biquadFilter.type = "lowpass";
                biquadFilter.frequency.value = 350; 
                biquadFilter.Q.value = 1;

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 8192;

                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(biquadFilter);
                biquadFilter.connect(analyser);
                
                isTuning = true;
                
                contenedorEncendido.style.opacity = '0';
                setTimeout(() => { contenedorEncendido.style.display = 'none'; }, 300);
                
                procesarAudio();

            } catch (err) {
                Swal.fire({
                    title: 'Micrófono Inactivo',
                    text: 'Debes otorgar permisos para poder afinar.',
                    icon: 'error',
                    background: '#1a1a1a', color: '#fff', confirmButtonColor: '#ff00ff'
                });
            }
        }

        let buffer = new Float32Array(8192); 
        let frecuenciaSuavizada = 0;
        
        // Memoria para el filtro de mediana recortada a 5 para menor lag
        let historialFrecuencias = [];
        const MAX_HISTORIAL = 5; 

        function procesarAudio() {
            analyser.getFloatTimeDomainData(buffer);
            let frecuenciaCruda = autoCorrelate(buffer, audioContext.sampleRate);

            if (frecuenciaCruda !== -1) {
                let freqProcesada = frecuenciaCruda;

                if (frecuenciaSuavizada > 0) {
                    if (freqProcesada > frecuenciaSuavizada * 1.85 && freqProcesada < frecuenciaSuavizada * 2.15) {
                        freqProcesada = freqProcesada / 2;
                    } else if (freqProcesada < frecuenciaSuavizada * 0.55 && freqProcesada > frecuenciaSuavizada * 0.45) {
                        freqProcesada = freqProcesada * 2;
                    }
                }

                // FILTRO DE MEDIANA (Atenuado para mayor respuesta)
                historialFrecuencias.push(freqProcesada);
                if (historialFrecuencias.length > MAX_HISTORIAL) {
                    historialFrecuencias.shift();
                }
                
                let tempSorted = [...historialFrecuencias].sort((a, b) => a - b);
                let frecuenciaFiltrada = tempSorted[Math.floor(tempSorted.length / 2)];

                // AMORTIGUADOR RÁPIDO (Menos inercia matemática = reacción en tiempo real)
                if (frecuenciaSuavizada === 0 || Math.abs(frecuenciaSuavizada - frecuenciaFiltrada) > 20) {
                    frecuenciaSuavizada = frecuenciaFiltrada;
                } else {
                    // 60% viejo, 40% nuevo (Más sensible al movimiento real de la clavija)
                    frecuenciaSuavizada = (frecuenciaSuavizada * 0.60) + (frecuenciaFiltrada * 0.40);
                }

                let notaMidi = calcularNotaDesdeFrecuencia(frecuenciaSuavizada);
                let cents = calcularCentsOffset(frecuenciaSuavizada, notaMidi);

                // IMÁN
                if (Math.abs(cents) <= 3) cents = 0;

                // Actualizar Textos
                notaEl.innerHTML = formatearNombreNota(notaMidi);
                hzEl.innerText = frecuenciaSuavizada.toFixed(1);
                
                let signo = cents > 0 ? "+" : "";
                centsEl.innerText = `${signo}${cents}`;

                // Mapear Cents a Grados
                let angulo = (cents / 50) * 75; 
                if(angulo > 75) angulo = 75;
                if(angulo < -75) angulo = -75;
                
                // Aplicación directa sin CSS Transition (Fluidéz de 60fps)
                agujaGrupo.style.transform = `rotate(${angulo}deg)`;

                visorEl.classList.remove('estado-bajo', 'estado-alto', 'estado-afinado');

                if (cents < -3) {
                    visorEl.classList.add('estado-bajo');
                } else if (cents > 3) {
                    visorEl.classList.add('estado-alto');
                } else {
                    visorEl.classList.add('estado-afinado');
                }
            }

            if(isTuning) {
                requestAnimationFrame(procesarAudio);
            }
        }

        // --- SCRIPT PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=tuner7')
                    .then(reg => console.log('SW Registrado'))
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>
</html>
